<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅片并发测试 - 可视化面板</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8;
    --green: #22c55e; --red: #ef4444; --yellow: #eab308; --blue: #3b82f6;
    --cyan: #06b6d4; --purple: #a855f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 16px; min-height: 100vh;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

  .controls {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border);
    padding: 14px 16px; border-radius: 10px; margin-bottom: 16px;
  }
  .controls label { font-size: 13px; color: var(--muted); }
  .controls input {
    background: #0b1220; border: 1px solid var(--border); color: var(--text);
    padding: 7px 10px; border-radius: 6px; width: 90px; font-size: 14px;
  }
  button {
    background: var(--blue); color: #fff; border: none; padding: 9px 20px;
    border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600;
  }
  button:hover { opacity: 0.9; }
  button.stop { background: var(--red); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-bottom: 16px;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; text-align: center;
  }
  .stat .num { font-size: 28px; font-weight: 700; }
  .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stat .num.green { color: var(--green); }
  .stat .num.red { color: var(--red); }
  .stat .num.cyan { color: var(--cyan); }
  .stat .num.yellow { color: var(--yellow); }

  .grid-wrap {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  @media (max-width: 1100px) { .grid-wrap { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; overflow: hidden;
  }
  .panel h2 { font-size: 15px; margin-bottom: 10px; color: var(--text); }

  .users-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    gap: 6px; max-height: 420px; overflow-y: auto;
  }
  .user-cell {
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 4px; text-align: center; font-size: 11px;
    transition: all 0.2s;
  }
  .user-cell .acct { font-weight: 600; font-size: 11px; }
  .user-cell .st { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .user-cell.pending { background: #0b1220; }
  .user-cell.login { background: #1e3a5f; border-color: var(--blue); }
  .user-cell.viewer { background: #3b2f1e; border-color: var(--yellow); }
  .user-cell.loading { background: #1e3a5f; border-color: var(--cyan); }
  .user-cell.done { background: #0f2e1a; border-color: var(--green); }
  .user-cell.error { background: #3a1515; border-color: var(--red); }

  .user-cell .bar {
    height: 4px; background: #0b1220; border-radius: 2px;
    margin: 4px 2px 2px; overflow: hidden;
  }
  .user-cell .bar-fill {
    height: 100%; background: var(--cyan); border-radius: 2px;
    transition: width 0.3s;
  }
  .user-cell.done .bar-fill { background: var(--green); }

  .log {
    max-height: 420px; overflow-y: auto; font-family: "SF Mono", Menlo, monospace;
    font-size: 11px; line-height: 1.5;
  }
  .log .row { padding: 2px 4px; border-bottom: 1px solid #0b1220; }
  .log .t { color: var(--muted); }
  .log .req { color: var(--cyan); }
  .log .resp { color: var(--green); }
  .log .err { color: var(--red); }
  .log .info { color: var(--yellow); }
  .log .tag { display: inline-block; min-width: 52px; text-align: center;
    border-radius: 3px; padding: 0 4px; font-size: 10px; margin: 0 4px; }
  .tag-login { background: #1e3a5f; color: #93c5fd; }
  .tag-frame { background: #3b2f1e; color: #fcd34d; }
  .tag-meta { background: #1e2a3a; color: #a5b4fc; }
  .tag-other { background: #1e293b; color: #94a3b8; }

  .summary-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .summary-table th, .summary-table td {
    border: 1px solid var(--border); padding: 6px 8px; text-align: left;
  }
  .summary-table th { background: #0b1220; color: var(--muted); }
  .summary-table td.num { text-align: right; font-variant-numeric: tabular-nums; }

  .config-panel { margin-bottom: 16px; }
  .config-panel .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .config-panel .field { display: flex; flex-direction: column; gap: 4px; }
  .config-panel .field label { font-size: 12px; color: var(--muted); }
  .config-panel .field input, .config-panel .field textarea {
    background: #0b1220; border: 1px solid var(--border); color: var(--text);
    padding: 7px 10px; border-radius: 6px; font-size: 13px;
  }
  .config-panel .field input { width: 220px; }
  .config-panel .field textarea { width: 100%; min-height: 90px; font-family: Menlo, monospace; }
  .config-panel .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .config-panel .actions { display: flex; gap: 10px; align-items: center; }
  .config-panel .btn2 {
    background: #334155; color: var(--text); border: 1px solid var(--border);
    padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .config-panel .btn2:hover { background: #475569; }
  .config-panel .saved { color: var(--green); font-size: 13px; }
</style>
</head>
<body>
  <h1>阅片并发测试 · 可视化面板</h1>
  <div class="sub">模拟 100 个不同用户（不同笔记本 + Chrome）同时登录并进入图像工作站阅片</div>

  <div class="panel config-panel">
    <h2>接口与账号配置</h2>
    <div class="row">
      <div class="field">
        <label>产品地址 (base_url)</label>
        <input id="cfgBaseUrl" placeholder="http://192.168.108.109:8000">
      </div>
      <div class="field">
        <label>登录页路径</label>
        <input id="cfgLoginPath" placeholder="/app/center/login">
      </div>
      <div class="field">
        <label>阅片页路径模板</label>
        <input id="cfgViewerPath" placeholder="/app/txzq/view/{study_uid}">
      </div>
      <div class="field">
        <label>阅片目标 study_uid</label>
        <input id="cfgStudyUid" placeholder="1.3.46.670589...">
      </div>
      <div class="field">
        <label>密码</label>
        <input id="cfgPassword" placeholder="123qwe">
      </div>
    </div>
    <div class="row">
      <div class="field" style="flex:1">
        <label>账号列表（每行一个，或范围 test2-test100，或逗号分隔）</label>
        <textarea id="cfgAccounts" placeholder="test&#10;test2-test100"></textarea>
        <div class="hint">当前账号数：<span id="cfgCount">0</span></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn2" onclick="saveConfig()">保存配置</button>
      <button class="btn2" onclick="loadConfig()">重新加载</button>
      <span class="saved" id="cfgSaved"></span>
    </div>
  </div>

  <div class="controls">
    <label>用户数</label>
    <input id="users" type="number" value="100" min="1" max="100">
    <label>图像加载超时上限(秒)</label>
    <input id="observe" type="number" value="60" min="10" max="300">
    <button id="btnStart" onclick="startTest()">开始测试</button>
    <button id="btnStop" class="stop" onclick="stopTest()" disabled>停止</button>
    <span id="runState" style="font-size:13px;color:var(--muted)">空闲</span>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="sTotal">0</div><div class="lbl">总用户</div></div>
    <div class="stat"><div class="num green" id="sLogin">0</div><div class="lbl">登录成功</div></div>
    <div class="stat"><div class="num cyan" id="sViewer">0</div><div class="lbl">进入阅片</div></div>
    <div class="stat"><div class="num yellow" id="sLoading">0</div><div class="lbl">加载中</div></div>
    <div class="stat"><div class="num" id="sDone">0</div><div class="lbl">已完成</div></div>
    <div class="stat"><div class="num red" id="sError">0</div><div class="lbl">出错</div></div>
    <div class="stat"><div class="num" id="sAvgLogin">-</div><div class="lbl">平均登录(ms)</div></div>
    <div class="stat"><div class="num" id="sAvgViewer">-</div><div class="lbl">平均阅片页(ms)</div></div>
    <div class="stat"><div class="num" id="sAvgAll">-</div><div class="lbl">平均整套图像加载(ms)</div></div>
    <div class="stat"><div class="num" id="sFrames">0</div><div class="lbl">图像帧请求总数</div></div>
  </div>

  <div class="grid-wrap">
    <div class="panel">
      <h2>用户状态</h2>
      <div class="users-grid" id="usersGrid"></div>
    </div>
    <div class="panel">
      <h2>请求过程（实时）</h2>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div class="panel" style="margin-top:16px">
    <h2>结果汇总</h2>
    <table class="summary-table" id="summaryTable">
      <thead><tr><th>指标</th><th>avg</th><th>min</th><th>max</th><th>p50</th><th>p95</th><th>p99</th></tr></thead>
      <tbody id="summaryBody"></tbody>
    </table>
  </div>

  <div class="panel" style="margin-top:16px">
    <h2>并发证据（可审计）</h2>
    <div id="evidence" style="font-size:13px;color:var(--muted)">测试完成后显示</div>
    <div style="margin-top:10px">
      <button class="btn2" onclick="downloadReport()">导出报告 (JSON)</button>
    </div>
  </div>

<script>
let ws = null;
let users = [];
let framesTotal = 0;
let logCount = 0;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (e) => handleEvent(JSON.parse(e.data));
  ws.onclose = () => { setTimeout(connect, 2000); };
}

function handleEvent(ev) {
  if (ev.type === "start") {
    users = ev.accounts.map((a, i) => ({
      id: i, account: a, status: "pending", login_ms: 0, viewer_ms: 0,
      first_frame_ms: 0, all_frames_ms: 0, frames: 0, total_frames: 0, error: ""
    }));
    framesTotal = 0;
    logCount = 0;
    document.getElementById("log").innerHTML = "";
    document.getElementById("summaryBody").innerHTML = "";
    renderUsers();
    addLog("info", `测试启动：${ev.users} 个用户`);
    setRunning(true);
  }
  else if (ev.type === "progress") {
    addLog("info", ev.msg);
  }
  else if (ev.type === "user_status") {
    const u = users[ev.user_id];
    if (u) { u.status = ev.status; if (ev.error) u.error = ev.error; renderUsers(); }
  }
  else if (ev.type === "login_ok") {
    const u = users[ev.user_id];
    if (u) { u.login_ms = ev.login_ms; u.status = "login"; renderUsers(); }
  }
  else if (ev.type === "viewer_ok") {
    const u = users[ev.user_id];
    if (u) { u.viewer_ms = ev.viewer_ms; u.status = "loading"; renderUsers(); }
  }
  else if (ev.type === "total_frames") {
    const u = users[ev.user_id];
    if (u) { u.total_frames = ev.total_frames; renderUsers(); }
  }
  else if (ev.type === "user_done") {
    const u = users[ev.user_id];
    if (u) {
      u.frames = ev.frames_loaded;
      u.total_frames = ev.total_frames || 0;
      u.all_frames_ms = ev.all_frames_ms || 0;
      u.status = "done";
      renderUsers();
    }
  }
  else if (ev.type === "request") {
    if (ev.tag === "图像帧") {
      framesTotal += 1;
      const u = users[ev.user_id];
      if (u) {
        u.frames += 1;
        u.status = "loading";
        // 节流重绘，避免每帧都全量重绘 100 个格子
        if (!u._lastRender || Date.now() - u._lastRender > 200) {
          u._lastRender = Date.now();
          renderUsers();
        }
      }
    }
    addLog("req", `[${ev.account}] ${ev.method} ${shortUrl(ev.url)}`, ev.tag);
  }
  else if (ev.type === "response") {
    const cls = ev.status >= 400 ? "err" : "resp";
    addLog(cls, `[${ev.account}] ${ev.status} ${shortUrl(ev.url)}`, ev.tag);
  }
  else if (ev.type === "summary") {
    setRunning(false);
    renderSummary(ev.states);
    addLog("info", "测试完成，结果已汇总");
    loadEvidence();
  }
  updateStats();
}

async function loadEvidence() {
  const res = await fetch("/api/report");
  const data = await res.json();
  if (!data.ok) return;
  const el = document.getElementById("evidence");
  el.innerHTML = `
    <div style="margin-bottom:8px">
      <b>用户总数：</b>${data.users} &nbsp;&nbsp;
      <b>独立会话 token 数：</b>${data.unique_tokens}
      ${data.unique_tokens === data.users ? '（每个用户一个独立会话 ✅）' : '（⚠️ 存在重复会话）'}
    </div>
    <div style="margin-bottom:8px">
      <b>登录时间戳极差：</b>${data.login_spread_seconds} 秒 &nbsp;&nbsp;
      <b>进入阅片时间戳极差：</b>${data.viewer_spread_seconds} 秒 &nbsp;&nbsp;
      <b>首帧请求时间戳极差：</b>${data.first_frame_spread_seconds} 秒
      <div style="color:var(--muted);font-size:12px">极差越小，说明越接近"同时"发起</div>
    </div>`;
}

async function downloadReport() {
  const res = await fetch("/api/report");
  const data = await res.json();
  if (!data.ok) { alert(data.msg); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "concurrency_report.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function shortUrl(url) {
  const base = "http://192.168.108.109:8000";
  let u = url.replace(base, "");
  if (u.length > 70) u = u.slice(0, 70) + "…";
  return u;
}

function addLog(cls, text, tag) {
  const log = document.getElementById("log");
  const row = document.createElement("div");
  row.className = "row " + cls;
  const time = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  let tagHtml = "";
  if (tag) {
    const tagCls = tag === "登录" ? "tag-login" : tag === "图像帧" ? "tag-frame"
      : (tag === "图像元数据" || tag === "序列数据") ? "tag-meta" : "tag-other";
    tagHtml = `<span class="tag ${tagCls}">${tag}</span>`;
  }
  row.innerHTML = `<span class="t">${time}</span>${tagHtml}${text}`;
  log.appendChild(row);
  logCount++;
  if (logCount > 2000) { log.removeChild(log.firstChild); logCount--; }
  log.scrollTop = log.scrollHeight;
}

function renderUsers() {
  const grid = document.getElementById("usersGrid");
  grid.innerHTML = "";
  const statusText = { pending: "等待", login: "登录中", viewer: "进入阅片",
    loading: "加载图像", done: "完成", error: "出错" };
  for (const u of users) {
    const cell = document.createElement("div");
    cell.className = "user-cell " + u.status;

    // 图像加载进度条
    let progress = "";
    if (u.status === "loading" || u.status === "done") {
      const total = u.total_frames || 0;
      const pct = total > 0 ? Math.min(100, Math.round(u.frames / total * 100)) : 0;
      progress = `
        <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="st">${u.frames}/${total || "?"} 帧 (${pct}%)</div>`;
    }

    // 阶段耗时
    let timing = "";
    if (u.login_ms > 0) timing += `<div class="st">登录 ${Math.round(u.login_ms)}ms</div>`;
    if (u.viewer_ms > 0) timing += `<div class="st">页面 ${Math.round(u.viewer_ms)}ms</div>`;
    if (u.all_frames_ms > 0) timing += `<div class="st">图像 ${Math.round(u.all_frames_ms)}ms</div>`;

    cell.innerHTML = `<div class="acct">${u.account}</div>
      <div class="st">${statusText[u.status] || u.status}</div>${progress}${timing}`;
    grid.appendChild(cell);
  }
}

function updateStats() {
  const n = users.length;
  const login = users.filter(u => u.login_ms > 0).length;
  const viewer = users.filter(u => u.viewer_ms > 0).length;
  const loading = users.filter(u => u.status === "loading").length;
  const done = users.filter(u => u.status === "done").length;
  const err = users.filter(u => u.status === "error").length;
  const loginMs = users.filter(u => u.login_ms > 0).map(u => u.login_ms);
  const viewerMs = users.filter(u => u.viewer_ms > 0).map(u => u.viewer_ms);
  const allMs = users.filter(u => u.all_frames_ms > 0).map(u => u.all_frames_ms);

  document.getElementById("sTotal").textContent = n;
  document.getElementById("sLogin").textContent = login;
  document.getElementById("sViewer").textContent = viewer;
  document.getElementById("sLoading").textContent = loading;
  document.getElementById("sDone").textContent = done;
  document.getElementById("sError").textContent = err;
  document.getElementById("sAvgLogin").textContent =
    loginMs.length ? Math.round(avg(loginMs)) : "-";
  document.getElementById("sAvgViewer").textContent =
    viewerMs.length ? Math.round(avg(viewerMs)) : "-";
  document.getElementById("sAvgAll").textContent =
    allMs.length ? Math.round(avg(allMs)) : "-";
  document.getElementById("sFrames").textContent = framesTotal;
}

function avg(a) { return a.reduce((x, y) => x + y, 0) / a.length; }
function pct(a, p) {
  if (!a.length) return 0;
  const s = [...a].sort((x, y) => x - y);
  const idx = Math.min(s.length - 1, Math.floor(s.length * p / 100));
  return Math.round(s[idx]);
}

function renderSummary(states) {
  const loginMs = states.filter(s => s.login_ms > 0).map(s => s.login_ms);
  const viewerMs = states.filter(s => s.viewer_ms > 0).map(s => s.viewer_ms);
  const firstMs = states.filter(s => s.first_frame_ms > 0).map(s => s.first_frame_ms);
  const allMs = states.filter(s => s.all_frames_ms > 0).map(s => s.all_frames_ms);
  const frames = states.filter(s => s.frames_loaded > 0).map(s => s.frames_loaded);

  const rows = [
    ["登录耗时(ms)", loginMs],
    ["阅片页加载(ms)", viewerMs],
    ["首帧耗时(ms)", firstMs],
    ["整套图像加载完成(ms)", allMs],
    ["图像帧加载数", frames],
  ];
  const body = document.getElementById("summaryBody");
  body.innerHTML = "";
  for (const [name, arr] of rows) {
    if (!arr.length) continue;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${name}</td>
      <td class="num">${Math.round(avg(arr))}</td>
      <td class="num">${Math.round(Math.min(...arr))}</td>
      <td class="num">${Math.round(Math.max(...arr))}</td>
      <td class="num">${pct(arr, 50)}</td>
      <td class="num">${pct(arr, 95)}</td>
      <td class="num">${pct(arr, 99)}</td>`;
    body.appendChild(tr);
  }
}

function setRunning(r) {
  document.getElementById("btnStart").disabled = r;
  document.getElementById("btnStop").disabled = !r;
  document.getElementById("runState").textContent = r ? "运行中…" : "空闲";
}

// ---- 配置录入 ----
function fillConfigForm(cfg) {
  document.getElementById("cfgBaseUrl").value = cfg.base_url || "";
  document.getElementById("cfgLoginPath").value = cfg.login_path || "";
  document.getElementById("cfgViewerPath").value = cfg.viewer_path_template || "";
  document.getElementById("cfgStudyUid").value = cfg.study_uid || "";
  document.getElementById("cfgPassword").value = cfg.password || "";
  const accounts = cfg.accounts || [];
  document.getElementById("cfgAccounts").value = accounts.join("\n");
  document.getElementById("cfgCount").textContent = accounts.length;
}

async function loadConfig() {
  const res = await fetch("/api/config");
  const data = await res.json();
  if (data.ok) {
    fillConfigForm(data.config);
    document.getElementById("cfgSaved").textContent = "";
  }
}

async function saveConfig() {
  const payload = {
    base_url: document.getElementById("cfgBaseUrl").value.trim(),
    login_path: document.getElementById("cfgLoginPath").value.trim(),
    viewer_path_template: document.getElementById("cfgViewerPath").value.trim(),
    study_uid: document.getElementById("cfgStudyUid").value.trim(),
    password: document.getElementById("cfgPassword").value,
    accounts_text: document.getElementById("cfgAccounts").value,
  };
  const res = await fetch("/api/config", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (data.ok) {
    document.getElementById("cfgCount").textContent = data.accounts_count;
    document.getElementById("cfgSaved").textContent =
      `已保存（${data.accounts_count} 个账号）`;
    setTimeout(() => document.getElementById("cfgSaved").textContent = "", 3000);
  } else {
    alert("保存失败");
  }
}

async function startTest() {
  const users = parseInt(document.getElementById("users").value) || 100;
  const observe = parseFloat(document.getElementById("observe").value) || 15;
  // 先保存当前表单配置，再启动
  await saveConfig();
  const res = await fetch("/api/start", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ users, observe })
  });
  const data = await res.json();
  if (!data.ok) alert(data.msg);
}

async function stopTest() {
  await fetch("/api/stop", { method: "POST" });
}

connect();
loadConfig();
</script>
